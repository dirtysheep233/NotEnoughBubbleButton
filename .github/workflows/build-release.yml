# MoreBubbleButton — Release 构建工作流
#
# 产物：
#   1. 每次构建都上传 signed APK 作为 Actions artifact
#   2. 推送 v* 标签（或手动触发并指定 release_tag）时，自动创建 / 更新 GitHub Release
#   3. 构建失败时把 gradle 报错摘要写进 Annotation，并上传完整日志 artifact
#
# 签名方式：CI 内部用 apksigner 直接签名（不依赖 build.gradle 里是否配了 signingConfigs）
# 签名依赖仓库 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
name: Build Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（留空则只构建，不发 Release），例如 v1.37'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    branches: [main, master, 'feature/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk=37 在 Google 仓库中的包名为 platforms;android-37.0
      # （目录 android-37.0，AGP 按 platforms/android-37 查找），需显式安装并软链。
      - name: Install Android SDK platform 37 + build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            curl -sSL -o /tmp/ct.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/ct.zip -d /tmp/ct
            mv /tmp/ct/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 编译（不签名）───────────────────────────────────────────────
      # 先把「代码能不能编过」这件事单独跑出来：
      # 编译失败在这里就停，不会和签名错误混在一起，排查面更小。
      # tee 把完整日志落到 /tmp/gradle-build.log，供失败摘要步骤读取。
      - name: Build unsigned release
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # ── 失败摘要（方法1 的核心）────────────────────────────────────
      # 构建失败时，从日志里抽出关键行，用 ::error:: 写到 Annotation，
      # 这样在 Actions 页面直接能看到「哪个 Task FAILED + 具体 error 行」。
      - name: Summarize build failure
        if: failure()
        run: |
          LOG=/tmp/gradle-build.log
          if [ ! -f "$LOG" ]; then
            echo "::error::没有找到 gradle 日志文件 $LOG（可能在构建启动前就失败了）"
            exit 0
          fi

          echo "=========== 失败摘要开始 ==========="
          echo "日志总行数: $(wc -l < "$LOG")"
          echo "------------------------------------"

          # 1) 是哪个 Task 挂了
          echo "[失败任务]"
          grep -nE '^> Task .* FAILED' "$LOG" | tail -5 || echo "  (未匹配到 '> Task ... FAILED')"
          echo "------------------------------------"

          # 2) Java 编译错误（最多 15 条，带文件:行号）
          echo "[Java 编译错误]"
          grep -nE 'error:' "$LOG" | head -15 || echo "  (无 Java 编译错误)"
          echo "------------------------------------"

          # 3) Gradle 根因
          echo "[What went wrong]"
          awk '/\* What went wrong:/{flag=1} flag{print}' "$LOG" | head -30 || echo "  (未匹配到 What went wrong)"
          echo "------------------------------------"

          # 4) R8 / 资源压缩相关（若存在）
          echo "[R8 / 资源压缩线索]"
          grep -nE '(minifyReleaseWithR8|shrinkReleaseResources|Missing class|ERROR:.*R8)' "$LOG" | head -10 || echo "  (无 R8 线索)"
          echo "=========== 失败摘要结束 ==========="

          # 5) 把摘要压成单条 Annotation（Annotation 内换行会被折叠，故用空格连接）
          TASK=$(grep -oE '^> Task [^ ]+ FAILED' "$LOG" | tail -1 || true)
          SUMMARY=$(awk '/\* What went wrong:/{flag=1} flag{print}' "$LOG" | head -12 | tr '\n' ' ' | tr -s ' ' | cut -c1-1800 || true)
          ERRLINE=$(grep -E 'error:' "$LOG" | head -3 | tr '\n' ' ' | tr -s ' ' | cut -c1-1800 || true)

          if [ -n "$TASK" ]; then
            echo "::error title=失败任务::$TASK"
          fi
          if [ -n "$SUMMARY" ]; then
            echo "::error title=What went wrong::$SUMMARY"
          elif [ -n "$ERRLINE" ]; then
            echo "::error title=编译错误行::$ERRLINE"
          else
            echo "::error title=未提取到根因::请下载 artifact 'gradle-log' 查看完整日志"
          fi

      # 完整日志也存一份，Annotation 有长度限制时用它兜底
      - name: Upload gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到任何 APK 产物，请检查 build.gradle 的 buildTypes 是否包含 release"
            exit 1
          fi
          echo "Unsigned APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ── 签名 secrets 校验 ──────────────────────────────────────────
      - name: Verify signing secrets are present
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 Secrets:$missing"
            echo "请在 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi
          echo "四个签名 Secrets 均已配置"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 用 apksigner 直接签名 ─────────────────────────────────────
      # 这样即使 build.gradle(.kts) 里没有 signingConfigs，也能产出可安装的 APK。
      - name: Sign APK with apksigner
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 解码 keystore（base64 必须单行生成：base64 -w 0）
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
                 -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::keystore 无法打开，请检查 KEYSTORE_BASE64 是否为单行 base64、密码是否正确"
            exit 1
          fi

          # 找最新的 build-tools 里的 apksigner
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ] || [ ! -x "${BT}apksigner" ]; then
            echo "::error::未找到 apksigner（build-tools 未安装？）"
            exit 1
          fi

          UNSIGNED="${{ steps.locate.outputs.apk }}"
          SIGNED="MoreBubbleButton-$(grep -o 'versionName *= *"[^"]*"' app/build.gradle.kts 2>/dev/null | head -1 | cut -d'"' -f2 || true).apk"
          [ "$SIGNED" = "MoreBubbleButton-.apk" ] && SIGNED="MoreBubbleButton-signed.apk"

          cp "$UNSIGNED" "$SIGNED"
          "${BT}apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$SIGNED"

          echo "== 签名校验 =="
          "${BT}apksigner" verify --print-certs "$SIGNED" | head -5
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MoreBubbleButton-signed
          path: MoreBubbleButton-*.apk
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          case "$GITHUB_REF" in
            refs/tags/*) [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then echo "将创建 Release: $TAG"; else echo "无标签，仅构建"; fi

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MoreBubbleButton ${{ steps.tag.outputs.tag }}
          files: MoreBubbleButton-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
